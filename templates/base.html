<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}MoveSafe{% endblock %}</title>

    <!-- favicon -->
    <link rel="shortcut icon" href="../assets/img/logo.jpeg" type="image/jpeg">

    <!-- Bootstrap e Font Awesome (CDN, em vez dos ficheiros locais do LusoHealth) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS próprio (o ?v=1 obriga o browser a descarregar a versão nova) -->
    <link rel="stylesheet" href="/css/movesafe.css?v=1">
</head>

<body class="bg-page-light">

    <!-- HEADER -->
    <header class="container-fluid bg-white border-bottom p-3 shadow-sm">
        <div class="row align-items-center">
            <div class="col-6 d-flex align-items-center">
                <i class="fa-solid fa-heart-pulse fa-2xl me-3 icon-brand-clinical"></i>
                <h3 class="mb-0 fw-bold text-dark">MoveSafe <span class="fs-6 text-muted fw-normal">| Monitorização
                        Clínica</span></h3>
            </div>

            <div class="col-6 text-end d-flex justify-content-end align-items-center gap-2">
                <span id="estado" class="badge bg-secondary-subtle text-secondary border rounded-pill px-3 py-2">
                    a ligar...
                </span>
                <button id="btnSom" type="button" class="btn btn-outline-success btn-sm rounded-pill px-3 fw-medium">
                    <i class="fa-solid fa-bell me-1"></i>Ativar som
                </button>
            </div>
        </div>
    </header>

    <div class="container-fluid mt-4">
        <div class="row g-4">

            <!-- SIDEBAR -->
            <aside class="col-md-3 col-lg-2">
                <div class="bg-white p-3 shadow-sm border border-light-subtle main-container-height custom-card-rounded">
                    <h6 class="fw-bold text-muted small text-uppercase px-2 mb-3">Navegação</h6>
                    <nav class="nav flex-column gap-1">

                        <a class="nav-link px-3 py-2 rounded-3 {{ 'fw-bold text-success bg-success-subtle' if request.path == '/' else 'text-secondary fw-medium' }}"
                            href="/">
                            <i class="fa-solid fa-chart-line me-2"></i>Dashboard
                        </a>
                        <a class="nav-link text-secondary fw-medium px-3 py-2 rounded-3" href="#"
                            title="Em desenvolvimento">
                            <i class="fa-solid fa-user-injured me-2"></i>Doentes
                        </a>
                        <a class="nav-link text-secondary fw-medium px-3 py-2 rounded-3" href="#"
                            title="Em desenvolvimento">
                            <i class="fa-solid fa-calendar-check me-2"></i>Sessões
                        </a>
                        <a class="nav-link text-secondary fw-medium px-3 py-2 rounded-3" href="#"
                            title="Em desenvolvimento">
                            <i class="fa-solid fa-clock-rotate-left me-2"></i>Histórico
                        </a>

                    </nav>
                </div>
            </aside>

            <!-- CONTEÚDO DE CADA PÁGINA -->
            <main class="col-md-9 col-lg-10">
                {% block conteudo %}{% endblock %}
            </main>

        </div>
    </div>

    <!-- FOOTER (scripts) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
